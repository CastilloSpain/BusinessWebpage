# Codex project configuration for the standalone static SvelteKit site.
# Shared repository instructions live in /workspace/AGENTS.md.
# First-party Svelte skills generated by `sv add ai-tools` live in
# /workspace/.agents/skills/ and are discovered automatically.

sandbox_mode = "workspace-write"
approval_policy = "on-request"

[sandbox_workspace_write]
network_access = true

# Svelte's first-party documentation and code-validation server.
# Claude Code reads the matching definition from /.mcp.json.
[mcp_servers.svelte]
command = "npx"
args = ["-y", "@sveltejs/mcp"]
